[build-system]
# setuptools >= 77 is required for PEP 639 license and license-files keys.
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "gitlytics"
version = "0.8.0"
description = "Monitor and automate your GitHub repository traffic analytics."
readme = "README.md"
requires-python = ">=3.11"
# Declare Apache-2.0 with Commons Clause using a PEP 639 LicenseRef identifier.
license = "LicenseRef-Apache-2.0-with-Commons-Clause"
license-files = ["LICENSE"]
authors = [
    { name = "Ameya Chopade", email = "ameyasanjaychopade@gmail.com" }
]
# Core runtime dependencies with minimum supported versions.
# python-dotenv lives in [dev] because only tests load .env files.
dependencies = [
    "requests>=2.34.2",
    "certifi>=2026.10.23",
    "pandas>=2.2.3",
    "numpy>=1.26.4",
    "croniter>=6.2.4"
]
keywords = [
    "github",
    "traffic",
    "analytics",
    "automation",
    "cli"
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
]

[project.urls]
Homepage = "https://gitlytics.dev"
Documentation = "https://docs.gitlytics.dev"
Repository = "https://github.com/ameyachopade/gitlytics"
"Bug Tracker" = "https://github.com/ameyachopade/gitlytics/issues"

[project.optional-dependencies]
# Optional extras for the local FastAPI dashboard server.
dashboard = [
    "fastapi>=0.162.0",
    "uvicorn>=0.54.0",
    "python-multipart>=0.0.33"
]
dev = [
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "httpx2>=2.16.2",       # required by FastAPI TestClient in test_api.py
    "anyio[trio]>=4.16.0",  # async test support
    "python-dotenv>=1.2.4"  # only tests load .env files
]


[project.scripts]
gitlytics = "gitlytics.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["gitlytics*"]
# `gitlytics*` also matches `gitlytics.__pycache__`, which setuptools would
# otherwise ship as a namespace package with host-specific `.pyc` files.
exclude = [
    "gitlytics.__pycache__",
    "gitlytics.__pycache__.*",
    "gitlytics.*.__pycache__",
    "*.__pycache__",
    "*.__pycache__.*",
]

[tool.setuptools.package-data]
"gitlytics" = ["static/**/*", "static/*"]

[tool.pytest.ini_options]
# Only collect files that match the offline test naming convention.
# live_*.py scripts are excluded - they need a real GitHub token.
pythonpath = ["src"]
testpaths = ["tests"]
python_files  = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
