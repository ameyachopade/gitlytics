[build-system]
# setuptools >= 77 is required for the PEP 639 `license` / `license-files`
# project-table keys (AF2-LIB-11).
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "gitlytics"
version = "0.7.2"
description = "Monitor and automate your GitHub repository traffic analytics."
readme = "README.md"
requires-python = ">=3.11"
# PEP 639 (PEP 621): declare a machine-readable SPDX expression instead of
# inlining the whole licence text into the wheel METADATA. The licence is
# Apache-2.0 with the Commons Clause, which has no upstream SPDX id, so the
# project uses a LicenseRef (AF2-LIB-11).
license = "LicenseRef-Apache-2.0-with-Commons-Clause"
license-files = ["LICENSE"]
authors = [
    { name = "Ameya Chopade", email = "ameyaccod171@gmail.com" }
]
# Fix #20: Add version lower-bounds to prevent silent breakage on old environments.
# These match the constraints already documented in requirements.txt.
# python-dotenv was removed from runtime deps — the library never reads .env;
# only tests use it, so it lives in the [dev] extra below.
dependencies = [
    "requests>=2.34.2",
    "certifi>=2026.10.23",
    "pandas>=2.2.3",
    "numpy>=1.26.4",
    "croniter>=6.2.4"
]
keywords = [
    "github",
    "traffic",
    "analytics",
    "automation",
    "cli"
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
]

[project.urls]
Homepage = "https://gitlytics.dev"
Documentation = "https://docs.gitlytics.dev"
Repository = "https://github.com/ameyachopade/gitlytics"
"Bug Tracker" = "https://github.com/ameyachopade/gitlytics/issues"

[project.optional-dependencies]
# Fix #20: dashboard extras are optional — base package works without them.
# requirements.txt was including them as mandatory; that was wrong.
dashboard = [
    "fastapi>=0.162.0",
    "uvicorn>=0.54.0",
    "python-multipart>=0.0.33"
]
dev = [
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "httpx>=0.28.1",      # required by FastAPI TestClient (used in test_api.py)
    "anyio[trio]>=4.16.0", # async test support
    "python-dotenv>=1.2.4"  # only tests load .env — runtime package doesn't
]


[project.scripts]
gitlytics = "gitlytics.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["gitlytics*"]
# `gitlytics*` also matches `gitlytics.__pycache__`, which setuptools would
# otherwise ship as a namespace package with host-specific `.pyc` files.
exclude = ["gitlytics.__pycache__", "gitlytics.__pycache__.*", "gitlytics.*.__pycache__"]

[tool.setuptools.package-data]
"gitlytics" = ["static/**/*", "static/*"]

[tool.pytest.ini_options]
# Only collect files that match the offline test naming convention.
# live_*.py scripts are excluded - they need a real GitHub token.
pythonpath = ["src"]
testpaths = ["tests"]
python_files  = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
# pytest-asyncio >= 1.x warns when the event-loop scope for async fixtures is
# left unset, and the default will change in a future release. Pin it
# explicitly so the suite is deterministic and warning-free.
asyncio_default_fixture_loop_scope = "function"
filterwarnings = [
    "error::DeprecationWarning",
    "error::PendingDeprecationWarning",
    "default::starlette.exceptions.StarletteDeprecationWarning",
]
