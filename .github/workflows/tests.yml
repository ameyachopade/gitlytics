name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'push' }}

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      # The cross-repo contract tests (tests/test_metadata_contract.py) compare
      # this package's version against the metadata sites'. Without this
      # checkout they silently skip, so the "single source of version truth"
      # guarantee is never enforced in CI (AF2-LIB-13).
      - name: Checkout the metadata sites
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        continue-on-error: true
        with:
          repository: ameyachopade/gitlytics-metadata-pages
          ref: ${{ vars.METADATA_REF || 'main' }}
          path: gitlytics-metadata-pages
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@0a5c61591373683505ea898e09a3ea4f39ef2b9c # v5.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,dashboard]"

      - name: Verify the declared Python floor matches the runtime
        run: |
          python - <<'PY'
          import sys, tomllib
          from pathlib import Path

          data = tomllib.loads(Path("pyproject.toml").read_text(encoding="utf-8"))
          floor = data["project"]["requires-python"]
          assert floor == ">=3.11", floor
          assert sys.version_info >= (3, 11), sys.version
          print(f"requires-python={floor}; running {sys.version.split()[0]}")
          PY

      - name: Run tests
        run: python -m pytest -q
