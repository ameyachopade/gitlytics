name: Upload Python Package to PyPI

on:
  release:
    types: [published]

# Two releases created close together must not race on the same upload.
concurrency:
  group: pypi-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  test:
    name: Build, verify, and test the released commit
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read

    steps:
      - name: Checkout the release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Verify bundled static assets
        run: |
          test -f src/gitlytics/static/index.html || {
            echo "::error::src/gitlytics/static/index.html is missing"
            exit 1
          }

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install build and test dependencies
        run: |
          python -m pip install --no-cache-dir build==1.2.2.post1
          python -m pip install -e ".[dev,dashboard]"

      - name: Build and verify package
        run: |
          rm -rf build dist
          python -m build
          python - <<'PY'
          import zipfile, pathlib
          whl = next(pathlib.Path("dist").glob("*.whl"))
          with zipfile.ZipFile(whl) as zf:
              entries = [n for n in zf.namelist() if n.startswith("gitlytics/static/assets/index-") and n.endswith(".js")]
              assert entries, "missing entry JS bundle in wheel"
              bundle = zf.read(entries[0]).decode("utf-8", errors="replace")
              assert "http://localhost:8000" not in bundle, "wheel must not bake localhost:8000"
              assert "VITE_BACKEND_URL must be set" not in bundle, "wheel must be built in local mode (IS_CLOUD dead-code eliminated)"
          PY

      - name: Run tests
        run: python -m pytest -q

      - name: Upload built distributions
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-dists
          path: dist/
          retention-days: 1

  pypi-publish:
    name: Publish verified artifact to PyPI
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: pypi

    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    # REQUIRED for Trusted Publishing
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download verified distributions
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-dists
          path: dist/

      - name: Publish package
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086
        with:
          attestations: true
          verbose: true
