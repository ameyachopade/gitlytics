name: Upload Python Package to PyPI

on:
  release:
    types: [published]

# Two releases created close together must not race on the same upload.
concurrency:
  group: pypi-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  test:
    name: Test the released commit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
      - name: Checkout the release tag
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Set up Python
        uses: actions/setup-python@0a5c61591373683505ea898e09a3ea4f39ef2b9c # v5.0.0
        with:
          python-version: "3.12"

      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,dashboard]"

      - name: Run tests
        run: python -m pytest -q

  pypi-publish:
    name: Build and publish to PyPI
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: pypi

    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    # REQUIRED for Trusted Publishing
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.release.tag_name }}

      # Fallback validation: ensure bundled static assets exist and are valid localmode
      - name: Verify bundled static assets
        run: |
          test -f src/gitlytics/static/index.html || {
            echo "::error::src/gitlytics/static/index.html is missing"
            exit 1
          }

      - name: Set up Python
        uses: actions/setup-python@0a5c61591373683505ea898e09a3ea4f39ef2b9c # v5.0.0
        with:
          python-version: "3.12"

      - name: Install build dependencies
        run: |
          python -m pip install --no-cache-dir build==1.2.2.post1
          python -m pip install -e ".[dev,dashboard]"

      - name: Build and verify package
        run: |
          rm -rf build dist
          python -m build
          python - <<'PY'
          import zipfile, pathlib
          whl = next(pathlib.Path("dist").glob("*.whl"))
          with zipfile.ZipFile(whl) as zf:
              entries = [n for n in zf.namelist() if n.startswith("gitlytics/static/assets/index-") and n.endswith(".js")]
              assert entries, "missing entry JS bundle in wheel"
              bundle = zf.read(entries[0]).decode("utf-8", errors="replace")
              assert "http://localhost:8000" not in bundle, "wheel must not bake localhost:8000"
              assert "VITE_BACKEND_URL must be set" not in bundle, "wheel must be built in local mode (IS_CLOUD dead-code eliminated)"
          PY
          python -m pytest -q

      - name: Publish package
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086
        with:
          attestations: true
          verbose: true
